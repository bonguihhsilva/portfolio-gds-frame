<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar objeto Json</title>
</head>

<body>
    <script>
        // 1. Definição do objeto em JavaScript
        var meuObjetoJSON = {
            "nome": "Ana",
            "idade": 30,
            "profissao": "Professora"
        };

        // 2. Conversão do objeto para string JSON formatada e escrita no HTML
        document.write(JSON.stringify(meuObjetoJSON, null, 2));
    </script>
</body>

</html>
