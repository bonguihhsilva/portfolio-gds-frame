services:
  chain:
    build: ./contracts
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      retries: 20

  deployer:
    build: ./contracts
    command: ["npx", "hardhat", "run", "scripts/deploy.js", "--network", "docker"]
    environment:
      DEPLOYMENT_FILE: /shared/deployment.json
    volumes:
      - shared:/shared
    depends_on:
      chain:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment:
      CHAIN_RPC_URL: http://chain:8545
      DEPLOYMENT_FILE: /shared/deployment.json
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/loja-chat
    volumes:
      - shared:/shared:ro
    depends_on:
      deployer:
        condition: service_completed_successfully
    ports:
      - "5050:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/health').status == 200 else 1)"]
      interval: 5s
      retries: 10

  # Chatbot de atendimento: workflow n8n versionado em n8n/. Sem GEMINI_API_KEY responde só pelo FAQ.
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.35.5
    entrypoint: ["/bin/sh", "-c"]
    command: ["n8n import:workflow --input=/workflows/chat-loja.json && n8n publish:workflow --id=loja-chat && exec n8n start"]
    environment:
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      CATALOG_URL: http://backend:5000/api/products
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
    volumes:
      - ./n8n/workflows:/workflows:ro
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      backend:
        condition: service_healthy
    # Nos primeiros segundos o n8n já escuta, mas ainda responde 404 no webhook. O readiness só vira 200 quando o workflow está ativo.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      retries: 40
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:5000
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-5511999999999}
    environment:
      BACKEND_URL: http://backend:5000
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_healthy
      n8n:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  shared:
  n8n_data:
